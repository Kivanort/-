name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']  # Запускается при пуше в main
  workflow_dispatch:    # Позволяет запустить вручную из интерфейса GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build  # Соберёт статику в папку out/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'  # Папка со статическими файлами[reference:6]

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
